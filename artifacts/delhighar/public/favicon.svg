<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338CA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="200" height="200" rx="48" fill="url(#bg)"/>
  <!-- Roof -->
  <path d="M100 36L166 92H34L100 36Z" fill="white" opacity="0.96"/>
  <!-- Chimney -->
  <rect x="120" y="50" width="13" height="42" rx="3" fill="white" opacity="0.75"/>
  <!-- House body -->
  <rect x="44" y="92" width="112" height="76" rx="4" fill="white" opacity="0.96"/>
  <!-- Door -->
  <rect x="79" y="114" width="42" height="54" rx="8" fill="url(#bg)"/>
  <!-- Door knob -->
  <circle cx="113" cy="143" r="3" fill="url(#gold)"/>
  <!-- Left window -->
  <rect x="54" y="104" width="19" height="15" rx="4" fill="url(#bg)" opacity="0.55"/>
  <!-- Right window -->
  <rect x="127" y="104" width="19" height="15" rx="4" fill="url(#bg)" opacity="0.55"/>
  <!-- Gold accent bar -->
  <rect x="72" y="162" width="56" height="5" rx="2.5" fill="url(#gold)"/>
</svg>
